<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Amenity Details - Travel System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: url('https://picsum.photos/1920/1080?random=4') no-repeat center center fixed;
            background-size: cover;
            background-color: #343a40;
        }
        .details-wrapper {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 40px;
            margin-top: 80px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 details-wrapper">
            <h3 class="fw-bold mb-4 text-info"><i class="fa-solid fa-circle-info me-2"></i>Amenity Details</h3>

            <div class="mb-3">
                <label class="form-label text-muted fw-semibold">ID:</label>
                <p class="fs-5 fw-bold text-dark" th:text="${amenity.id}">1</p>
            </div>

            <div class="mb-4">
                <label class="form-label text-muted fw-semibold">Amenity Name:</label>
                <p class="fs-5 fw-bold text-dark" th:text="${amenity.name}">Wi-Fi</p>
            </div>

            <div class="d-flex justify-content-between">
                <a th:href="@{/admin/amenities}" class="btn btn-secondary">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to List
                </a>
                <a th:href="@{/admin/amenities/edit/{id}(id=${amenity.id})}" class="btn btn-primary">
                    <i class="fa-solid fa-pen-to-square me-1"></i> Edit
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
