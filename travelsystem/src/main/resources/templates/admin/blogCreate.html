<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Blog - Travel System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            background-color: #343a40;
        }
        .form-wrapper {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 40px;
            margin: 40px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 form-wrapper">
            <h3 class="fw-bold mb-4 text-primary"><i class="fa-solid fa-pen-to-square me-2"></i>Create New Blog Post</h3>

            <form th:action="@{/admin/blog/save}" th:object="${blog}" method="post">

                <div class="mb-3">
                    <label for="title" class="form-label fw-semibold">Blog Title</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="Enter blog title..." required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="author" class="form-label fw-semibold">Author</label>
                        <input type="text" id="author" th:field="*{author}" class="form-control" placeholder="Author name...">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="imageUrl" class="form-label fw-semibold">Image URL</label>
                        <input type="url" id="imageUrl" th:field="*{imageUrl}" class="form-control" placeholder="https://images.unsplash.com/...">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="shortDescription" class="form-label fw-semibold">Short Description</label>
                    <textarea id="shortDescription" th:field="*{shortDescription}" class="form-control" rows="2" placeholder="Brief summary of the blog..."></textarea>
                </div>

                <div class="mb-4">
                    <label for="content" class="form-label fw-semibold">Content</label>
                    <textarea id="content" th:field="*{content}" class="form-control" rows="6" placeholder="Full blog content..." required></textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/admin/blog}" class="btn btn-secondary">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to List
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-save me-1"></i> Save Blog
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
