<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin - Bloq İdarəetməsi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 50px 0;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            padding: 40px;
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 8px 20px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            text-decoration: none;
        }

        .btn-fancy-warning {
            background: linear-gradient(135deg, #ffc107, #ffca2c);
            border: none;
            color: #212529;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .btn-fancy-danger {
            background: linear-gradient(135deg, #dc3545, #ff6b6b);
            border: none;
            color: white;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-11">
                <div class="content-card">

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold text-primary mb-1">Admin - Bloq İdarəetmə Paneli</h2>
                            <p class="text-muted mb-0">Sistemdəki bütün bloq yazılarını idarə edin</p>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="/admin" class="btn btn-outline-primary rounded-pill px-4">Dashboard</a>
                            <a sec:authorize="hasRole('ADMIN')" href="/admin/blog/create" class="btn btn-fancy-primary">+ Yeni Bloq Əlavə Et</a>
                        </div>
                    </div>

                    <div class="table-responsive bg-white rounded-4 shadow-sm overflow-hidden">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-primary text-primary">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Başlıq</th>
                                <th>Yazar</th>
                                <th>Tarix</th>
                                <th class="text-end pe-4" sec:authorize="hasRole('ADMIN')">Əməliyyatlar</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="blog : ${blogs}">
                                <td class="ps-4 fw-semibold" th:text="${blog.id}">1</td>
                                <td>
                                    <a th:href="@{/blog/{id}(id=${blog.id})}" target="_blank" class="text-decoration-none fw-semibold text-dark" th:text="${blog.title}">Başlıq</a>
                                </td>
                                <td th:text="${blog.author}">Yazar</td>
                                <td th:text="${blog.createdDate != null ? #temporals.format(blog.createdDate, 'dd-MM-yyyy') : '-'}">Tarix</td>
                                <td class="text-end pe-4" sec:authorize="hasRole('ADMIN')">
                                    <a th:href="@{/admin/blog/edit/{id}(id=${blog.id})}" class="btn btn-fancy-warning me-1">Redaktə</a>
                                    <form th:action="@{/admin/blog/delete/{id}(id=${blog.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-fancy-danger" onclick="return confirm('Bu bloqu silmək istədiyinizə əminsinizmi?')">Sil</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${blogs == null || blogs.isEmpty()}">
                                <td colspan="4" sec:authorize="!hasRole('ADMIN')" class="text-center py-4 text-muted">Heç bir bloq tapılmadı.</td>
                                <td colspan="5" sec:authorize="hasRole('ADMIN')" class="text-center py-4 text-muted">Heç bir bloq tapılmadı.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
