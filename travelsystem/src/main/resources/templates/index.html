<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lüks Səyahət Dünyası - Ana Səhifə</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .hero-section {
            background: linear-gradient(rgba(13, 110, 253, 0.75), rgba(13, 202, 240, 0.75)),
                        url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 50px;
            color: #333;
            max-width: 900px;
            width: 100%;
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 12px 30px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(13, 110, 253, 0.4);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-fancy-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13, 110, 253, 0.6);
            color: white;
        }

        .stat-card {
            background: #f8fbff;
            border: 1px solid #e0f2fe;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.15);
            border-color: #0dcaf0;
        }
    </style>
</head>
<body>

<!-- Navbar fragmenti çağırıldı -->
<div th:replace="~{fragments/navbar :: headerNav}"></div>

<div class="hero-section">
    <div class="hero-card">
        <h1 class="fw-bold text-primary mb-3">Lüks Səyahət və Otel İdarəetmə Sistemi</h1>
        <p class="text-muted mb-4">Dünyanın ən gözəl məkanlarını kəşf edin, otel və otaq rezervasiyalarınızı asanlıqla idarə edin.</p>

        <!-- Naviqasiya düymələri -->
        <div class="d-flex justify-content-center gap-3 flex-wrap mb-5">
            <a href="/countries" class="btn btn-outline-primary rounded-pill px-4">Ölkələr</a>
            <a href="/cities" class="btn btn-outline-primary rounded-pill px-4">Şəhərlər</a>
            <a href="/hotels" class="btn btn-outline-primary rounded-pill px-4">Otellər</a>
            <a href="/rooms" class="btn btn-outline-primary rounded-pill px-4">Otaqlar</a>
            <a href="/amenities" class="btn btn-outline-primary rounded-pill px-4">Xidmətlər</a>
            <a href="/contact" class="btn btn-fancy-primary">Bizimlə Əlaqə</a>
        </div>

        <!-- Sistem Statistikaları / Qısa İcmal -->
        <div class="row g-3">
            <div class="col-md-4">
                <div class="stat-card">
                    <h5 class="text-muted small mb-1">Ölkələr</h5>
                    <h3 class="fw-bold text-primary mb-0" th:text="${countries != null ? countries.size() : 0}">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <h5 class="text-muted small mb-1">Şəhərlər</h5>
                    <h3 class="fw-bold text-primary mb-0" th:text="${cities != null ? cities.size() : 0}">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <h5 class="text-muted small mb-1">Otellər</h5>
                    <h3 class="fw-bold text-primary mb-0" th:text="${hotels != null ? hotels.size() : 0}">0</h3>
                </div>
            </div>
        </div>

        <div class="row g-3 mt-1">
            <div class="col-md-4">
                <div class="stat-card">
                    <h5 class="text-muted small mb-1">Otaqlar</h5>
                    <h3 class="fw-bold text-primary mb-0" th:text="${rooms != null ? rooms.size() : 0}">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <h5 class="text-muted small mb-1">Xidmətlər</h5>
                    <h3 class="fw-bold text-primary mb-0" th:text="${amenities != null ? amenities.size() : 0}">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <h5 class="text-muted small mb-1">Rezervasiyalar</h5>
                    <h3 class="fw-bold text-primary mb-0" th:text="${reservations != null ? reservations.size() : 0}">0</h3>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
