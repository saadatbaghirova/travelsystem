<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${blog.title}">Bloq Detalları</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 50px 0;
        }

        .details-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .blog-main-img {
            max-height: 450px;
            width: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 8px 25px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-9">
                <div class="details-card">

                    <h1 class="fw-bold text-primary mb-3" th:text="${blog.title}">Bloq Başlığı</h1>

                    <div class="d-flex justify-content-between text-muted small mb-4 pb-3 border-bottom">
                        <div>Yazar: <strong class="text-dark" th:text="${blog.author}">Admin</strong></div>
                        <div th:text="${blog.createdDate != null ? #temporals.format(blog.createdDate, 'dd-MM-yyyy HH:mm') : ''}">Tarix</div>
                    </div>

                    <div class="mb-4" th:if="${blog.imageUrl != null}">
                        <img th:src="${blog.imageUrl}" class="blog-main-img shadow-sm" alt="Blog Image">
                    </div>

                    <div class="mb-4">
                        <p class="lead fw-semibold text-secondary" th:text="${blog.shortDescription}">Qısa təsvir...</p>
                    </div>

                    <div class="mb-5" style="line-height: 1.9; white-space: pre-line;" th:text="${blog.content}">
                        Əsas mətn...
                    </div>

                    <div class="text-start">
                        <a href="/blog" class="btn btn-fancy-primary">Bloqlara Qayıt</a>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
