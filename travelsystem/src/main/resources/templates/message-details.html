<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mesaj Detalları</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1423666639041-f56000c27a9a?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 50px 0;
        }

        .details-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            padding: 40px;
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 8px 25px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="details-card">

                    <h2 class="fw-bold text-primary mb-3" th:text="${contactMessage.subject}">Mesaj Mövzusu</h2>

                    <div class="d-flex justify-content-between text-muted small mb-4 pb-3 border-bottom">
                        <div>Göndərən: <strong class="text-dark" th:text="${contactMessage.name}">Ad</strong> (<a th:href="'mailto:' + ${contactMessage.email}" th:text="${contactMessage.email}">email</a>)</div>
                        <div th:text="${contactMessage.createdDate != null ? #temporals.format(contactMessage.createdDate, 'dd-MM-yyyy HH:mm') : ''}">Tarix</div>
                    </div>

                    <div class="mb-5 p-4 rounded-4 bg-light shadow-sm" style="line-height: 1.8; white-space: pre-line;" th:text="${contactMessage.message}">
                        Mesaj məzmunu...
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="/contact/list" class="btn btn-fancy-primary">Mesajlar Siyahısına Qayıt</a>
                        <form th:action="@{/contact/delete/{id}(id=${contactMessage.id})}" method="post">
                            <button type="submit" class="btn btn-outline-danger rounded-pill px-4" onclick="return confirm('Bu mesajı silmək istədiyinizə əminsinizmi?')">Mesajı Sil</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
