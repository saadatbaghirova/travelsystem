<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('TravelSystem - Edit Country')"></head>
<style>
    body {
        background: linear-gradient(rgba(59, 47, 47, 0.55), rgba(59, 47, 47, 0.55)),
                    url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
        background-size: cover;
    }
    .form-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }
</style>
<body>

<!-- Sidebar -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Məzmun -->
<div style="margin-left: 260px; width: calc(100% - 260px); min-height: 100vh;" class="p-4">
    <div class="container my-5" style="max-width: 600px;">
        <div class="form-card p-4">
            <h2 class="fw-bold mb-4" style="color: #3b2f2f;"><i class="fa-solid fa-pen-to-square text-warning me-2"></i> Edit Country</h2>

            <form th:action="@{/admin/countries/update/{id}(id=${country.id})}" method="post" th:object="${country}">
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Country Name</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/admin/countries" class="btn btn-secondary px-4">Cancel</a>
                    <button type="submit" class="btn px-4 text-white" style="background-color: #c5a059;">Update Country</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
