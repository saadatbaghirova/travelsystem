<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ölkə Detalları</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 50px 0;
        }

        .details-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            padding: 40px;
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 8px 25px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="details-card">

                    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                        <div>
                            <h2 class="fw-bold text-primary mb-1" th:text="${country.name}">Ölkə Adı</h2>
                            <p class="text-muted mb-0">Kod: <span class="badge bg-light text-dark border px-2 py-1" th:text="${country.code}">AZ</span></p>
                        </div>
                        <a href="/admin/countries" class="btn btn-fancy-primary">Ölkələr Siyahısı</a>
                    </div>

                    <h4 class="fw-bold text-dark mb-3">Bu Ölkəyə Aid Şəhərlər</h4>

                    <div class="table-responsive bg-white rounded-4 shadow-sm overflow-hidden mb-4">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-primary">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Şəhər Adı</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="city : ${country.cities}">
                                <td class="ps-4 fw-semibold" th:text="${city.id}">1</td>
                                <td class="fw-semibold text-dark" th:text="${city.name}">Bakı</td>
                            </tr>
                            <tr th:if="${country.cities == null || country.cities.isEmpty()}">
                                <td colspan="2" class="text-center py-4 text-muted">Bu ölkəyə aid hələ heç bir şəhər əlavə edilməyib.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-start">
                        <a th:href="@{/admin/countries/edit/{id}(id=${country.id})}" class="btn btn-outline-warning rounded-pill px-4 me-2">Ölkəni Redaktə Et</a>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
