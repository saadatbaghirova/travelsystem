<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Haqqımızda - Lüks Səyahət Paneli</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        /* Ana səhifə arxa fonu (Lüks Səyahət Teması) */
        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 50px 0;
        }

        .about-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 40px;
        }

        /* Bəzəkli Ağ-Mavi Düymələr */
        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 8px 20px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            transition: all 0.2s ease-in-out;
            text-decoration: none;
        }

        .btn-fancy-primary:hover {
            background: linear-gradient(135deg, #0b5ed7, #0bacbe);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(13, 110, 253, 0.5);
        }

        .btn-fancy-warning {
            background: linear-gradient(135deg, #ffc107, #ffca2c);
            border: none;
            color: #212529;
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 500;
            box-shadow: 0 3px 8px rgba(255, 193, 7, 0.3);
            text-decoration: none;
        }

        .btn-fancy-danger {
            background: linear-gradient(135deg, #dc3545, #ff6b6b);
            border: none;
            color: white;
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 500;
            box-shadow: 0 3px 8px rgba(220, 53, 69, 0.3);
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="about-card">

                    <!-- Hero Bölməsi -->
                    <div class="text-center mb-5">
                        <h1 class="fw-bold text-primary" th:text="${about != null && about.heroTitle != null ? about.heroTitle : 'Lüks Səyahət Dünyası'}">Hero Başlıq</h1>
                        <p class="lead text-muted" th:text="${about != null && about.heroSubtitle != null ? about.heroSubtitle : 'Sizin etibarlı səyahət bələdçiniz'}">Hero Alt Başlıq</p>
                    </div>

                    <!-- Yalnız Admin üçün Edit və Delete İdarəetmə Düymələri -->
                    <div class="d-flex justify-content-end gap-2 mb-4" sec:authorize="hasRole('ADMIN')">
                        <a href="/admin/about/edit" class="btn btn-fancy-warning">Edit / Yenilə</a>

                        <form th:action="@{/admin/about/delete}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-fancy-danger" onclick="return confirm('Məlumatı silmək istədiyinizə əminsinizmi?')">Sil</button>
                        </form>
                    </div>

                    <!-- Şəkil -->
                    <div class="mb-4 text-center" th:if="${about != null && about.imageUrl != null}">
                        <img th:src="${about.imageUrl}" alt="About Image" class="img-fluid rounded-4 shadow-sm" style="max-height: 400px; width: 100%; object-fit: cover;">
                    </div>

                    <!-- Əsas Mətn -->
                    <div class="mb-4">
                        <h3 class="text-secondary fw-bold mb-3">Bizimlə Tanış Olun</h3>
                        <p class="text-muted" style="line-height: 1.8;" th:text="${about != null ? about.aboutText : 'Məlumat tapılmadı.'}">Haqqımızda ətraflçı mətn...</p>
                    </div>

                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <div class="p-4 bg-light rounded-4 h-100">
                                <h4 class="text-primary fw-bold mb-2">Missiyamız</h4>
                                <p class="text-muted mb-0" th:text="${about != null ? about.mission : ''}">Missiya mətni...</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="p-4 bg-light rounded-4 h-100">
                                <h4 class="text-primary fw-bold mb-2">Vizyonumuz</h4>
                                <p class="text-muted mb-0" th:text="${about != null ? about.vision : ''}">Vizyon mətni...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Əlaqə və Sosial şəbəkələr -->
                    <div class="border-top pt-4 mt-4">
                        <h4 class="text-secondary fw-bold mb-3">Əlaqə və Sosial Şəbəkələr</h4>
                        <p class="mb-1"><strong>Telefon:</strong> <span th:text="${about != null ? about.phone : '-'}">+994...</span></p>
                        <p class="mb-3"><strong>Email:</strong> <span th:text="${about != null ? about.email : '-'}">info@travel.com</span></p>

                        <div class="d-flex gap-3 flex-wrap">
                            <a th:if="${about != null && about.instagram != null}" th:href="${about.instagram}" target="_blank" class="btn btn-fancy-primary btn-sm">Instagram</a>
                            <a th:if="${about != null && about.facebook != null}" th:href="${about.facebook}" target="_blank" class="btn btn-fancy-primary btn-sm">Facebook</a>
                            <a th:if="${about != null && about.X != null}" th:href="${about.X}" target="_blank" class="btn btn-fancy-primary btn-sm">X (Twitter)</a>
                            <a th:if="${about != null && about.linkedin != null}" th:href="${about.linkedin}" target="_blank" class="btn btn-fancy-primary btn-sm">LinkedIn</a>
                            <a th:if="${about != null && about.youtube != null}" th:href="${about.youtube}" target="_blank" class="btn btn-fancy-primary btn-sm">YouTube</a>
                            <a th:if="${about != null && about.tiktok != null}" th:href="${about.tiktok}" target="_blank" class="btn btn-fancy-primary btn-sm">TikTok</a>
                        </div>
                    </div>

                    <div class="mt-5 text-center">
                        <a href="/admin/hotels" class="btn btn-fancy-primary">Ana Səhifəyə Qayıt</a>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
