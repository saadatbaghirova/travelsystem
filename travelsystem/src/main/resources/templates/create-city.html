<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yeni Şəhər Əlavə Et</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 50px 0;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            padding: 40px;
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="form-card">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Yeni Şəhər Əlavə Et</h2>
                        <p class="text-muted">Admin İdarəetmə Paneli</p>
                    </div>

                    <form th:action="@{/admin/cities/save}" th:object="${city}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Şəhər Adı</label>
                            <input type="text" th:field="*{name}" class="form-control rounded-pill px-3" placeholder="Məsələn: Paris" required>
                            <!-- Validasiya xətası -->
                            <div class="text-danger small mt-1 ps-3" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Xəta</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Ölkə</label>
                            <select th:field="*{country}" class="form-select rounded-pill px-3" required>
                                <option value="">Ölkə seçin...</option>
                                <option th:each="c : ${countries}" th:value="${c.id}" th:text="${c.name}">Ölkə</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="/admin/cities" class="btn btn-outline-secondary rounded-pill px-4">Geri Qayıt</a>
                            <button type="submit" class="btn btn-fancy-primary">Yadda Saxla</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
