<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Qeydiyyat - Lüks Səyahət Paneli</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 10px 20px;
            font-weight: 500;
            width: 100%;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            transition: all 0.2s ease-in-out;
        }

        .btn-fancy-primary:hover {
            background: linear-gradient(135deg, #0b5ed7, #0bacbe);
            color: white;
            transform: scale(1.02);
            box-shadow: 0 6px 15px rgba(13, 110, 253, 0.5);
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="auth-card">

        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Qeydiyyat</h2>
            <p class="text-muted small">Yeni hesab yaradaraq səyahətə başlayın</p>
        </div>

        <!-- AuthController-dəki /auth/register POST metoduna göndərir -->
        <form th:action="@{/auth/register}" th:object="${user}" method="post">

            <div class="mb-3">
                <label class="form-label fw-semibold small">Ad (First Name)</label>
                <input type="text" th:field="*{firstName}" class="form-control rounded-pill px-3" placeholder="Adınız" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">Soyad (Last Name)</label>
                <input type="text" th:field="*{lastName}" class="form-control rounded-pill px-3" placeholder="Soyadınız" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">Email</label>
                <input type="email" th:field="*{email}" class="form-control rounded-pill px-3" placeholder="email@example.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">Telefon nömrəsi (Phone Number)</label>
                <input type="text" th:field="*{phoneNumber}" class="form-control rounded-pill px-3" placeholder="+994501234567" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold small">Şifrə (Password)</label>
                <input type="password" th:field="*{password}" class="form-control rounded-pill px-3" placeholder="********" required>
            </div>

            <button type="submit" class="btn btn-fancy-primary mb-3">Qeydiyyatdan Keç</button>

            <div class="text-center">
                <p class="text-muted small mb-0">Artıq hesabınız var? <a href="/auth/login" class="text-primary text-decoration-none fw-semibold">Daxil olun</a></p>
            </div>

        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
