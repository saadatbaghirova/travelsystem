<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Otellər - Lüks Səyahət Dünyası</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 40px 0;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            padding: 30px;
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 8px 25px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-fancy-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(13, 110, 253, 0.5);
            color: white;
        }

        .hotel-card {
            background: #ffffff;
            border-radius: 15px;
            border: 1px solid #e0f2fe;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.05);
            overflow: hidden;
        }

        .hotel-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.15);
            border-color: #0dcaf0;
        }

        .table-custom th {
            background-color: #f0f8ff;
            color: #0d6efd;
            border-bottom: 2px solid #e0f2fe;
        }

        .table-custom td {
            vertical-align: middle;
        }

        .search-box {
            background: #f8fbff;
            border: 1px solid #e0f2fe;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-11">
                <div class="content-card">

                    <!-- Başlıq və Yeni Otel Əlavə Et Düyməsi -->
                    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                        <div>
                            <h2 class="fw-bold text-primary mb-1"><i class="bi bi-building me-2"></i>Otellər İdarəetmə Sistemi</h2>
                            <p class="text-muted mb-0">Sistemdə qeydiyyatda olan lüks otellərin siyahısı və idarə edilməsi</p>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="/" class="btn btn-outline-secondary rounded-pill px-4">Ana Səhifə</a>
                            <a sec:authorize="hasRole('ADMIN')" href="/admin/hotels/new" class="btn btn-fancy-primary"><i class="bi bi-plus-lg me-1"></i>Yeni Otel Əlavə Et</a>
                        </div>
                    </div>

                    <!-- Axtarış Bölməsi -->
                    <div class="search-box">
                        <form th:action="@{/admin/hotels/search}" method="get" class="row g-3 align-items-center">
                            <div class="col-md-8">
                                <input type="text" name="name" class="form-control rounded-pill px-3" placeholder="Otel adına görə axtarış..." required>
                            </div>
                            <div class="col-md-4">
                                <button type="submit" class="btn btn-outline-primary rounded-pill w-100"><i class="bi bi-search me-1"></i>Axtar</button>
                            </div>
                        </form>
                    </div>

                    <!-- Otellərin Cədvəl Şəklində Göstərilməsi -->
                    <div class="table-responsive" th:if="${hotels != null && !hotels.isEmpty()}">
                        <table class="table table-custom align-middle mb-4">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Otelin Adı</th>
                                <th>Şəhər</th>
                                <th>Ulduz</th>
                                <th>Ünvan</th>
                                <th class="text-end">Əməliyyatlar</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="hotel : ${hotels}">
                                <td class="fw-semibold" th:text="${hotel.id}">1</td>
                                <td>
                                    <a th:href="@{/admin/hotels/{id}(id=${hotel.id})}" class="text-decoration-none fw-bold text-dark" th:text="${hotel.name}">Hotel Name</a>
                                </td>
                                <td>
                                    <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-1 rounded-pill" th:text="${hotel.city != null ? hotel.city.name : 'Təyin edilməyib'}">City</span>
                                </td>
                                <td>
                                        <span class="text-warning">
                                            <span th:each="i : ${#numbers.sequence(1, hotel.star != null ? hotel.star : 0)}"><i class="bi bi-star-fill"></i></span>
                                        </span>
                                </td>
                                <td class="text-muted small" th:text="${hotel.address}">Address</td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2">
                                        <a th:href="@{/admin/hotels/{id}(id=${hotel.id})}" class="btn btn-outline-info btn-sm rounded-pill px-3" title="Bax"><i class="bi bi-eye"></i></a>
                                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/hotels/edit/{id}(id=${hotel.id})}" class="btn btn-outline-warning btn-sm rounded-pill px-3" title="Redaktə et"><i class="bi bi-pencil"></i></a>
                                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/hotels/delete/{id}(id=${hotel.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3" title="Sil" onclick="return confirm('Bu oteli silmək istədiyinizə əminsiniz?')"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                        <!-- Səhifələmə (Pagination) -->
                        <nav th:if="${hotelPage != null && hotelPage.totalPages > 1}" aria-label="Page navigation">
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:classappend="${hotelPage.first} ? 'disabled'">
                                    <a class="page-link rounded-start-pill" th:href="@{/admin/hotels(page=${hotelPage.number - 1}, size=${hotelPage.size})}">Əvvəlki</a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, hotelPage.totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                                    <a class="page-link" th:href="@{/admin/hotels(page=${i}, size=${hotelPage.size})}" th:text="${i + 1}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${hotelPage.last} ? 'disabled'">
                                    <a class="page-link rounded-end-pill" th:href="@{/admin/hotels(page=${hotelPage.number + 1}, size=${hotelPage.size})}">Növbəti</a>
                                </li>
                            </ul>
                        </nav>
                    </div>

                    <!-- Otel olmadığı halda göstərilən mesaj -->
                    <div class="text-center py-5" th:if="${hotels == null || hotels.isEmpty()}">
                        <div class="text-muted fs-5 mb-3">Sistemdə heç bir otel tapılmadı.</div>
                        <a sec:authorize="hasRole('ADMIN')" href="/admin/hotels/new" class="btn btn-fancy-primary">İlk Oteli Əlavə Et</a>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
