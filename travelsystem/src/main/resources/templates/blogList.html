<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bloqlar - Lüks Səyahət Dünyası</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 50px 0;
        }

        .blog-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 123, 255, 0.2);
        }

        .blog-img {
            height: 200px;
            object-fit: cover;
            width: 100%;
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 8px 20px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            text-decoration: none;
            transition: all 0.2s ease-in-out;
        }

        .btn-fancy-primary:hover {
            background: linear-gradient(135deg, #0b5ed7, #0bacbe);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(13, 110, 253, 0.5);
        }

        .header-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.1);
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container">

        <!-- Başlıq -->
        <div class="header-box text-center">
            <h1 class="fw-bold text-primary mb-2">Səyahət və Həyat tərzi Bloqu</h1>
            <p class="text-muted mb-3">Ən son hekayələr, məsləhətlər və səyahət bələdçiləri</p>
            <a href="/" class="btn btn-fancy-primary btn-sm">Ana Səhifə</a>
        </div>

        <!-- Bloqların Kartları Grid -->
        <div class="row g-4">
            <div class="col-md-4" th:each="blog : ${blogs}">
                <div class="blog-card">
                    <img th:src="${blog.imageUrl != null ? blog.imageUrl : 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=600&q=80'}" class="blog-img" alt="Blog Image">
                    <div class="p-4 d-flex flex-column flex-grow-1">
                        <div class="small text-primary fw-semibold mb-1" th:text="${blog.author != null ? blog.author : 'Admin'}">Yazar</div>
                        <h4 class="fw-bold mb-2 text-dark" th:text="${blog.title}">Bloq Başlığı</h4>
                        <p class="text-muted small flex-grow-1" th:text="${blog.shortDescription}">Qısa məlumat...</p>

                        <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                            <span class="small text-muted" th:text="${blog.createdDate != null ? #temporals.format(blog.createdDate, 'dd-MM-yyyy') : ''}">Tarix</span>
                            <a th:href="@{/blog/{id}(id=${blog.id})}" class="btn btn-fancy-primary btn-sm">Ətraflı Oxu</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 text-center" th:if="${blogs == null || blogs.isEmpty()}">
                <div class="header-box">
                    <p class="text-muted mb-0">Hələ ki heç bir bloq yazısı əlavə olunmayıb.</p>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
