<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Ölkələr - Lüks Səyahət Dünyası</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 50px 0;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            padding: 40px;
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 8px 20px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            text-decoration: none;
        }

        .btn-fancy-warning {
            background: linear-gradient(135deg, #ffc107, #ffca2c);
            border: none;
            color: #212529;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .btn-fancy-danger {
            background: linear-gradient(135deg, #dc3545, #ff6b6b);
            border: none;
            color: white;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="content-card">

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold text-primary mb-1">Ölkələr Siyahısı</h2>
                            <p class="text-muted mb-0">Səyahət sistemində qeydiyyatda olan ölkələr</p>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="/" class="btn btn-outline-primary rounded-pill px-4">Ana Səhifə</a>
                            <a sec:authorize="hasRole('ADMIN')" href="/admin/countries/create" class="btn btn-fancy-primary">+ Yeni Ölkə Əlavə Et</a>
                        </div>
                    </div>

                    <div class="table-responsive bg-white rounded-4 shadow-sm overflow-hidden">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-primary text-primary">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Ölkə Adı</th>
                                <th>Ölkə Kodu</th>
                                <th class="text-end pe-4">Əməliyyatlar</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="country : ${countries}">
                                <td class="ps-4 fw-semibold" th:text="${country.id}">1</td>
                                <td>
                                    <a th:href="@{/admin/countries/{id}(id=${country.id})}" class="fw-semibold text-decoration-none text-primary" th:text="${country.name}">Azərbaycan</a>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border px-3 py-2 rounded-pill" th:text="${country.code}">AZ</span>
                                </td>
                                <td class="text-end pe-4">
                                    <a th:href="@{/admin/countries/{id}(id=${country.id})}" class="btn btn-outline-primary btn-sm rounded-pill px-3 me-1">Bax</a>
                                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/countries/edit/{id}(id=${country.id})}" class="btn btn-fancy-warning me-1">Redaktə</a>
                                    <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/countries/delete/{id}(id=${country.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-fancy-danger" onclick="return confirm('Bu ölkəni silmək istədiyinizə əminsinizmi?')">Sil</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${countries == null || countries.isEmpty()}">
                                <td colspan="4" class="text-center py-4 text-muted">Heç bir ölkə tapılmadı.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
