<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${hotel.name} + ' - Detallar'">Otel Detalları - Lüks Səyahət Dünyası</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 40px 0;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            padding: 40px;
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 8px 25px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            text-decoration: none;
        }

        .hotel-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .info-box {
            background: #f8fbff;
            border: 1px solid #e0f2fe;
            border-radius: 15px;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="content-card">

                    <!-- Başlıq və Geri Düyməsi -->
                    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                        <div>
                            <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-1 rounded-pill mb-2" th:text="${hotel.city != null ? hotel.city.name : 'Şəhər yoxdur'}">City</span>
                            <h2 class="fw-bold text-primary mb-1" th:text="${hotel.name}">Otel Adı</h2>
                            <p class="text-muted mb-0"><i class="bi bi-geo-alt-fill text-danger me-1"></i><span th:text="${hotel.address}">Ünvan</span></p>
                        </div>
                        <div class="d-flex gap-2">
                            <a th:href="@{/admin/hotels/edit/{id}(id=${hotel.id})}" class="btn btn-outline-warning rounded-pill px-4"><i class="bi bi-pencil me-1"></i>Redaktə et</a>
                            <a href="/admin/hotels" class="btn btn-outline-secondary rounded-pill px-4">Geri Siyahıya</a>
                        </div>
                    </div>

                    <!-- Otel Şəkli -->
                    <div class="mb-4" th:if="${hotel.imageUrl != null && !hotel.imageUrl.isEmpty()}">
                        <img th:src="${hotel.imageUrl}" alt="Otel Şəkli" class="hotel-image">
                    </div>

                    <div class="row g-4 mb-4">
                        <!-- Ulduz və Əsas Məlumatlar -->
                        <div class="col-md-6">
                            <div class="info-box h-100">
                                <h5 class="fw-semibold text-primary mb-3">Otel Məlumatları</h5>
                                <p class="mb-2"><strong>Ulduz Sayı:</strong>
                                    <span class="text-warning">
                                        <span th:each="i : ${#numbers.sequence(1, hotel.star != null ? hotel.star : 0)}"><i class="bi bi-star-fill"></i></span>
                                    </span>
                                    <span class="ms-1" th:text="'(' + ${hotel.star} + ' Ulduz)'"></span>
                                </p>
                                <p class="mb-0"><strong>ID:</strong> <span th:text="${hotel.id}">1</span></p>
                            </div>
                        </div>

                        <!-- Xidmətlər (Amenities) -->
                        <div class="col-md-6">
                            <div class="info-box h-100">
                                <h5 class="fw-semibold text-primary mb-3">Otelin Xidmətləri</h5>
                                <div th:if="${hotel.amenities != null && !hotel.amenities.isEmpty()}" class="d-flex flex-wrap gap-2">
                                    <span class="badge bg-info bg-opacity-10 text-info px-3 py-2 rounded-pill" th:each="amenity : ${hotel.amenities}" th:text="${amenity.name}">Wi-Fi</span>
                                </div>
                                <div th:if="${hotel.amenities == null || hotel.amenities.isEmpty()}" class="text-muted small">
                                    Heç bir xidmət əlavə edilməyib.
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Təsvir (Description) -->
                    <div class="info-box mb-4">
                        <h5 class="fw-semibold text-primary mb-2">Haqqında</h5>
                        <p class="text-muted mb-0" th:text="${hotel.description}">Otel haqqında ətraflı məlumat...</p>
                    </div>

                    <!-- Otaqlar siyahısı (əgər varsa) -->
                    <div class="info-box" th:if="${hotel.rooms != null && !hotel.rooms.isEmpty()}">
                        <h5 class="fw-semibold text-primary mb-3">Bu Oteldəki Otaqlar</h5>
                        <ul class="list-group">
                            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="room : ${hotel.rooms}">
                                <span th:text="${room.roomNumber} + ' - ' + ${room.type}">Otaq</span>
                                <span class="badge bg-primary rounded-pill" th:text="${room.price} + ' AZN'">0 AZN</span>
                            </li>
                        </ul>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
