<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Şəhər Detalları</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f0f8ff; color: #333; }
        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover; min-height: 100vh; padding: 50px 0;
        }
        .content-card { background: rgba(255, 255, 255, 0.95); border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15); padding: 40px; }
    </style>
</head>
<body>
<div class="main-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="content-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="fw-bold text-primary"><i class="bi bi-geo-alt-fill me-2"></i>Şəhər Məlumatı</h2>
                        <a href="/admin/cities" class="btn btn-outline-primary rounded-pill px-4">Geri Qayıt</a>
                    </div>
                    <hr>
                    <div class="mb-3">
                        <h5 class="text-muted">Şəhər ID:</h5>
                        <p class="fs-5 fw-semibold" th:text="${city.id}">1</p>
                    </div>
                    <div class="mb-3">
                        <h5 class="text-muted">Şəhər Adı:</h5>
                        <p class="fs-4 fw-bold text-dark" th:text="${city.name}">Bakı</p>
                    </div>
                    <div class="mb-3">
                        <h5 class="text-muted">Ölkə:</h5>
                        <p class="fs-5" th:text="${city.country != null ? city.country.name : 'Ölkə təyin edilməyib'}">Azərbaycan</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
