<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${country.name} + ' - Şəhərlər'">Ölkə Şəhərləri - Lüks Səyahət Dünyası</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 50px 0;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            padding: 40px;
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 8px 25px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            text-decoration: none;
        }

        .city-card {
            background: #ffffff;
            border-radius: 15px;
            border: 1px solid #e0f2fe;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.05);
        }

        .city-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.15);
            border-color: #0dcaf0;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-9">
                <div class="content-card">

                    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                        <div>
                            <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-1 rounded-pill mb-2" th:text="${country.code}">AZ</span>
                            <h2 class="fw-bold text-primary mb-1" th:text="${country.name} + ' - Şəhərləri'">Ölkə Şəhərləri</h2>
                            <p class="text-muted mb-0">Bu ölkəyə aid səyahət edilə biləcək şəhərlər siyahısı</p>
                        </div>
                        <a href="/countries" class="btn btn-fancy-primary">Bütün Ölkələr</a>
                    </div>

                    <!-- Şəhərlərin Kartlar şəklində göstərilməsi -->
                    <div class="row g-4" th:if="${cities != null && !cities.isEmpty()}">
                        <div class="col-md-6" th:each="city : ${cities}">
                            <div class="city-card p-4 h-100 d-flex justify-content-between align-items-center">
                                <div>
                                    <h4 class="fw-semibold text-dark mb-1" th:text="${city.name}">Şəhər Adı</h4>
                                    <p class="text-muted small mb-0">ID: <span th:text="${city.id}">1</span></p>
                                </div>
                                <!-- Əgər otellər səhifəsinə keçid etmək istəsəniz buranı aktivləşdirə bilərsiniz -->
                                <a th:href="@{/cities/{id}/hotels(id=${city.id})}" class="btn btn-outline-primary btn-sm rounded-pill px-3">Otellərə Bax</a>
                            </div>
                        </div>
                    </div>

                    <!-- Şəhər olmadığı halda göstərilən mesaj -->
                    <div class="text-center py-5" th:if="${cities == null || cities.isEmpty()}">
                        <div class="text-muted fs-5 mb-3">Bu ölkəyə aid hələ heç bir şəhər əlavə edilməyib.</div>
                        <a href="/" class="btn btn-outline-secondary rounded-pill px-4">Ana Səhifəyə Qayıt</a>
                    </div>

                    <div class="mt-5 pt-3 border-top d-flex justify-content-start">
                        <a href="/countries" class="btn btn-outline-primary rounded-pill px-4">Geri Qayıt</a>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
