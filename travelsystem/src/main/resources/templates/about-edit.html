<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Haqqımızda Redaktə Et</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 50px 0;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            padding: 40px;
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
        }

        .btn-fancy-secondary {
            background: #6c757d;
            border: none;
            color: white;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 500;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="form-card">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Haqqımızda Məlumatını Yenilə</h2>
                        <p class="text-muted">Admin idarəetmə paneli</p>
                    </div>

                    <!-- Controller-dəki /admin/about/save metoduna göndərir -->
                    <form th:action="@{/admin/about/save}" th:object="${about}" method="post">

                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Hero Başlıq</label>
                            <input type="text" th:field="*{heroTitle}" class="form-control rounded-pill px-3" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Hero Alt Başlıq</label>
                            <input type="text" th:field="*{heroSubtitle}" class="form-control rounded-pill px-3">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Haqqımızda Mətni</label>
                            <textarea th:field="*{aboutText}" class="form-control rounded-4 p-3" rows="4" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Missiya</label>
                            <textarea th:field="*{mission}" class="form-control rounded-4 p-3" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Vizyon</label>
                            <textarea th:field="*{vision}" class="form-control rounded-4 p-3" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Şəkil URL</label>
                            <input type="text" th:field="*{imageUrl}" class="form-control rounded-pill px-3">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Telefon</label>
                                <input type="text" th:field="*{phone}" class="form-control rounded-pill px-3">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" th:field="*{email}" class="form-control rounded-pill px-3">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Instagram Linki</label>
                                <input type="text" th:field="*{instagram}" class="form-control rounded-pill px-3">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Facebook Linki</label>
                                <input type="text" th:field="*{facebook}" class="form-control rounded-pill px-3">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">X (Twitter) Linki</label>
                                <input type="text" th:field="*{X}" class="form-control rounded-pill px-3">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">LinkedIn Linki</label>
                                <input type="text" th:field="*{linkedin}" class="form-control rounded-pill px-3">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">YouTube Linki</label>
                                <input type="text" th:field="*{youtube}" class="form-control rounded-pill px-3">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">TikTok Linki</label>
                                <input type="text" th:field="*{tiktok}" class="form-control rounded-pill px-3">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="/about" class="btn btn-fancy-secondary">Geri qayıt</a>
                            <button type="submit" class="btn btn-fancy-primary">Yadda Saxla (Save)</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
