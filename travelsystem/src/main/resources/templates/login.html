<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistemə Giriş - Lüks Səyahət Paneli</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 10px 20px;
            font-weight: 500;
            width: 100%;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            transition: all 0.2s ease-in-out;
        }

        .btn-fancy-primary:hover {
            background: linear-gradient(135deg, #0b5ed7, #0bacbe);
            color: white;
            transform: scale(1.02);
            box-shadow: 0 6px 15px rgba(13, 110, 253, 0.5);
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="auth-card">

        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Xoş Gəlmisiniz</h2>
            <p class="text-muted small">Lüks Səyahət və Otel Sisteminə daxil olun</p>
        </div>

        <!-- Uğurlu çıxış və ya xəta mesajları -->
        <div th:if="${param.logout}" class="alert alert-success py-2 text-center small rounded-pill">
            Sistemdən uğurla çıxış etdiniz.
        </div>
        <div th:if="${param.error}" class="alert alert-danger py-2 text-center small rounded-pill">
            Email və ya şifrə yanlışdır!
        </div>

        <!-- Security üçün login forması (SecurityConfig-də loginProcessingUrl("/auth/login") təyin edilib) -->
        <form th:action="@{/auth/login}" method="post">

            <div class="mb-3">
                <label class="form-label fw-semibold small">Email (Username)</label>
                <input type="email" name="username" class="form-control rounded-pill px-3" placeholder="email@example.com" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold small">Şifrə (Password)</label>
                <input type="password" name="password" class="form-control rounded-pill px-3" placeholder="********" required>
            </div>

            <button type="submit" class="btn btn-fancy-primary mb-3">Daxil Ol</button>

            <div class="text-center">
                <p class="text-muted small mb-0">Hesabınız yoxdur? <a href="/auth/register" class="text-primary text-decoration-none fw-semibold">Qeydiyyatdan keçin</a></p>
            </div>

        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
