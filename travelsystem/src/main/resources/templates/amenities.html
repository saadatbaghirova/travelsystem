<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Otel İmkanları (Amenities) - Lüks Səyahət Paneli</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1584132967334-10e028bd69f7?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 50px 0;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .btn-fancy-primary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 8px 20px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            text-decoration: none;
            transition: all 0.2s ease-in-out;
        }

        .btn-fancy-primary:hover {
            background: linear-gradient(135deg, #0b5ed7, #0bacbe);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(13, 110, 253, 0.5);
        }

        .btn-fancy-warning {
            background: linear-gradient(135deg, #ffc107, #ffca2c);
            border: none;
            color: #212529;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.85rem;
            box-shadow: 0 3px 8px rgba(255, 193, 7, 0.3);
            text-decoration: none;
        }

        .btn-fancy-danger {
            background: linear-gradient(135deg, #dc3545, #ff6b6b);
            border: none;
            color: white;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.85rem;
            box-shadow: 0 3px 8px rgba(220, 53, 69, 0.3);
        }

        .table-custom {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.05);
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="content-card">

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold text-primary mb-1">Otel İmkanları (Amenities)</h2>
                            <p class="text-muted mb-0">Otellərə aid xidmət və imkanların idarə edilməsi</p>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="/admin" class="btn btn-outline-primary rounded-pill px-4">Dashboard</a>
                            <a sec:authorize="hasRole('ADMIN')" href="/admin/amenities/create" class="btn btn-fancy-primary">+ Yeni İmkan Əlavə Et</a>
                        </div>
                    </div>

                    <!-- Cədvəl -->
                    <div class="table-responsive table-custom">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-primary text-primary">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>İmkanın Adı (Name)</th>
                                <th class="text-end pe-4" sec:authorize="hasRole('ADMIN')">Əməliyyatlar</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="amenity : ${amenities}">
                                <td class="ps-4 fw-semibold" th:text="${amenity.id}">1</td>
                                <td>
                                    <a th:href="@{/admin/amenities/{id}(id=${amenity.id})}" class="text-decoration-none fw-semibold text-dark" th:text="${amenity.name}">WiFi</a>
                                </td>
                                <td class="text-end pe-4" sec:authorize="hasRole('ADMIN')">
                                    <a th:href="@{/admin/amenities/edit/{id}(id=${amenity.id})}" class="btn btn-fancy-warning me-1">Redaktə</a>
                                    <form th:action="@{/admin/amenities/delete/{id}(id=${amenity.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-fancy-danger" onclick="return confirm('Bu imkanı silmək istədiyinizə əminsinizmi?')">Sil</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${amenities == null || amenities.isEmpty()}">
                                <td colspan="2" sec:authorize="!hasRole('ADMIN')" class="text-center py-4 text-muted">Heç bir imkan tapılmadı.</td>
                                <td colspan="3" sec:authorize="hasRole('ADMIN')" class="text-center py-4 text-muted">Heç bir imkan tapılmadı.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
