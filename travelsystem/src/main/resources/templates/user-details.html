<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${user.firstName + ' ' + user.lastName + ' - Detallar'}">İstifadəçi Detalları</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f0f8ff; color: #333; }
        .main-container {
            background: linear-gradient(rgba(240, 248, 255, 0.9), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover; min-height: 100vh; padding: 40px 0;
        }
        .content-card { background: rgba(255, 255, 255, 0.95); border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 123, 255, 0.15); padding: 40px; }
        .info-box { background: #f8fbff; border: 1px solid #e0f2fe; border-radius: 15px; padding: 20px; }
    </style>
</head>
<body>
<div class="main-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-9">
                <div class="content-card">

                    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                        <div>
                            <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-1 rounded-pill mb-2" th:text="${user.role}">ROLE</span>
                            <h2 class="fw-bold text-primary mb-1" th:text="${user.firstName + ' ' + user.lastName}">Ad Soyad</h2>
                            <p class="text-muted mb-0"><i class="bi bi-envelope text-info me-1"></i>Email: <span class="fw-semibold text-dark" th:text="${user.email}">email</span></p>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="/admin/users" class="btn btn-outline-secondary rounded-pill px-4">İstifadəçilərə Qayıt</a>
                        </div>
                    </div>

                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <div class="info-box h-100">
                                <h5 class="fw-semibold text-primary mb-3"><i class="bi bi-person-badge me-2"></i>Əlaqə Məlumatları</h5>
                                <p class="mb-2"><strong>Telefon:</strong> <span class="text-dark fw-medium" th:text="${user.phoneNumber}">+994...</span></p>
                                <p class="mb-0"><strong>Qeydiyyat Tarixi:</strong> <span th:text="${user.createdDate != null ? user.createdDate : 'Təyin edilməyib'}">Date</span></p>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="info-box h-100">
                                <h5 class="fw-semibold text-primary mb-3"><i class="bi bi-shield-lock me-2"></i>Təhlükəsizlik</h5>
                                <p class="mb-0"><strong>Şifrə:</strong> <span class="text-muted">******** (Gizli saxlanılır)</span></p>
                            </div>
                        </div>
                    </div>

                    <!-- İstifadəçinin Rezervasiyaları (Əgər varsa) -->
                    <div class="info-box" th:if="${user.reservations != null && !user.reservations.isEmpty()}">
                        <h5 class="fw-semibold text-primary mb-3"><i class="bi bi-calendar-check me-2"></i>İstifadəçinin Rezervasiyaları</h5>
                        <ul class="list-group">
                            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="res : ${user.reservations}">
                                <span th:text="'Otaq ID: ' + (${res.room != null ? res.room.id : 'N/A'}) + ' | ' + ${res.checkInDate} + ' — ' + ${res.checkOutDate}">Rezerv</span>
                                <span class="badge bg-success rounded-pill" th:text="${res.totalPrice} + ' AZN'">0 AZN</span>
                            </li>
                        </ul>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
