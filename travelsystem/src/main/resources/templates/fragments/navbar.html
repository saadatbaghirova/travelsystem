<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Navbar</title>
</head>
<body>

<!-- NAVBAR START -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-3 mb-4" style="border-bottom: 2px solid #e0f2fe;" th:fragment="headerNav">
    <div class="container">
        <!-- Brand / Logo -->
        <a class="navbar-brand fw-bold text-primary d-flex align-items-center" href="/">
            <i class="bi bi-airplane-engines fs-3 me-2 text-info"></i>
            <span>Lüks Səyahət Dünyası</span>
        </a>

        <!-- Mobil menyu düyməsi -->
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menyu Linkləri -->
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav align-items-center gap-2">
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded-pill fw-medium text-dark hover-bg-light" href="/">
                        <i class="bi bi-house-door me-1 text-primary"></i> Ana Səhifə
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link px-3 py-2 rounded-pill fw-medium text-dark hover-bg-light" href="/admin/rooms">
                        <i class="bi bi-door-open me-1 text-primary"></i> Otaqlar
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link px-3 py-2 rounded-pill fw-medium text-dark hover-bg-light" href="/admin/users">
                        <i class="bi bi-people me-1 text-primary"></i> İstifadəçilər
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded-pill fw-medium text-dark hover-bg-light" href="/admin/reservations">
                        <i class="bi bi-calendar-check me-1 text-primary"></i> Rezervasiyalar
                    </a>
                </li>
                <!-- Sürətli Əlavə Et Düyməsi (Yalnız ADMIN) -->
                <li class="nav-item ms-lg-2" sec:authorize="hasRole('ADMIN')">
                    <a href="/admin/users/create" class="btn btn-fancy-primary btn-sm rounded-pill px-4 py-2 text-white" style="background: linear-gradient(135deg, #0d6efd, #0dcaf0); border: none;">
                        <i class="bi bi-plus-circle me-1"></i> Qeydiyyat
                    </a>
                </li>
                <!-- Çıxış (Logout) Düyməsi -->
                <li class="nav-item ms-lg-2">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-4 py-2">
                            <i class="bi bi-box-arrow-right me-1"></i> Çıxış
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<style>
    .hover-bg-light:hover {
        background-color: #f0f8ff !important;
        color: #0d6efd !important;
        transition: all 0.3s ease;
    }
</style>
<!-- NAVBAR END -->

</body>
</html>
