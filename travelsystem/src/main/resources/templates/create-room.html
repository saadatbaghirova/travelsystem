<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Room - Travel System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1591088398332-8a7791972843?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            background-color: #343a40;
        }
        .form-wrapper {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 40px;
            margin: 40px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 form-wrapper">
            <h3 class="fw-bold mb-4 text-primary"><i class="fa-solid fa-door-open me-2"></i>Add New Room</h3>

            <form th:action="@{/admin/rooms/save}" th:object="${room}" method="post">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="roomNumber" class="form-label fw-semibold">Room Number</label>
                        <input type="text" id="roomNumber" th:field="*{roomNumber}" class="form-control" th:classappend="${#fields.hasErrors('roomNumber')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="type" class="form-label fw-semibold">Room Type</label>
                        <input type="text" id="type" th:field="*{type}" class="form-control" th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'" placeholder="e.g. Deluxe, Standard">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label fw-semibold">Price ($)</label>
                        <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="capacity" class="form-label fw-semibold">Capacity (Persons)</label>
                        <input type="number" id="capacity" th:field="*{capacity}" class="form-control" th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="status" class="form-label fw-semibold">Status</label>
                    <select id="status" th:field="*{status}" class="form-select" th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                        <option value="">-- Select Status --</option>
                        <option value="Available">Available</option>
                        <option value="Booked">Booked</option>
                        <option value="Maintenance">Maintenance</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                </div>

                <div class="mb-4">
                    <label for="hotel" class="form-label fw-semibold">Hotel</label>
                    <select id="hotel" th:field="*{hotel}" class="form-select">
                        <option value="">-- Select Hotel --</option>
                        <option th:each="h : ${hotels}" th:value="${h.id}" th:text="${h.name}"></option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/admin/rooms}" class="btn btn-secondary">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-save me-1"></i> Save Room
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
